[project]
name = "netsuke"
version = "0.1.0"
description = "RGB PDF -> CMYK PDF web service (Cloudflare Container + Zero Trust)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "img2pdf>=0.5.1",
    "jinja2>=3.1.6",
    "pillow>=12.2.0",
    "python-multipart>=0.0.29",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
